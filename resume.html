<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Резюме — Диана Северюхина, UX/UI-дизайнер</title>
  <meta name="description" content="Резюме Дианы Северюхиной, UX/UI-дизайнера: просмотр онлайн и скачивание PDF.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1f90ec">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=3">
  <style>
    .rs-bar { position: sticky; top: 0; z-index: 10; background: rgba(245, 245, 245, .85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(51, 51, 51, .08); }
    .rs-bar__in { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; padding-block: 10px; }
    .rs-back { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--blue-hover); margin-right: auto; }
    .rs-back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--ease); }
    .rs-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .rs-actions .btn { font-size: 16px; padding: 12px 16px; }
    .rs-actions .btn .ico { width: 22px; height: 22px; }
    .rs-head { padding: 48px 0 24px; }
    .rs-head h1 { font-size: 40px; font-weight: 700; }
    .rs-head p { margin-top: 8px; color: var(--text-muted); }
    .rs-pages { display: grid; gap: 24px; max-width: 860px; margin: 0 auto; padding-bottom: 80px; }
    .rs-page { position: relative; margin: 0; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-400); animation: fadeUp .7s var(--ease) both; }
    .rs-page:nth-child(2) { animation-delay: .12s; }
    .rs-page img { width: 100%; height: auto; }
    .rs-page a { position: absolute; border-radius: 4px; }
    .rs-page a:focus-visible { outline: 2px solid var(--blue); }
    .rs-pages:fullscreen { display: block; max-width: none; margin: 0; padding: 24px 16px 48px; overflow-y: auto; background: #2b2f36; }
    .rs-pages:fullscreen .rs-page { max-width: 1100px; margin: 0 auto 24px; }
    .rs-pages.rs-full { position: fixed; inset: 0; z-index: 50; display: block; max-width: none; margin: 0; padding: 24px 16px 48px; overflow-y: auto; background: #2b2f36; }
    .rs-pages.rs-full .rs-page { max-width: 1100px; margin: 0 auto 24px; }
    .rs-close { display: none; position: fixed; right: 18px; top: 14px; z-index: 60; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--text); font-size: 28px; line-height: 1; box-shadow: var(--shadow-400); }
    .rs-pages:fullscreen .rs-close, .rs-pages.rs-full .rs-close { display: block; }
    .rs-page img { cursor: zoom-in; }
    .rs-pages:fullscreen .rs-page img, .rs-pages.rs-full .rs-page img { cursor: default; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } }
    @media (hover: hover) {
      .rs-back:hover svg { transform: translateX(-4px); }
      .rs-page a:hover { background: rgba(31, 144, 236, .12); }
    }
    @media (max-width: 720px) {
      .rs-head { padding-top: 28px; }
      .rs-head h1 { font-size: 28px; }
      .rs-actions { width: 100%; }
      .rs-actions .btn { flex: 1; }
      .rs-pages { gap: 14px; }
    }
  </style>
</head>
<body>
  <div class="rs-bar">
    <div class="container rs-bar__in">
      <a class="rs-back" href="./#contacts"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>К UX-кейсу</a>
      <div class="rs-actions">
        <button class="btn btn--outline" type="button" id="rs-full">Во весь экран <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#1f90ec" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
        <a class="btn" href="assets/docs/resume-severyukhina.pdf" download="Резюме Северюхина Диана.pdf">Скачать PDF <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg></a>
      </div>
    </div>
  </div>
  <main class="container">
    <div class="rs-head">
      <h1 class="grad-text">Резюме</h1>
      <p>Диана Северюхина · UX/UI-дизайнер</p>
    </div>
    <div class="rs-pages" id="rs-pages">
      <button class="rs-close" type="button" id="rs-close" aria-label="Закрыть полноэкранный режим">×</button>
      <figure class="rs-page">
        <img src="assets/docs/resume-p1.webp" width="1488" height="2105" alt="Резюме Дианы Северюхиной, страница 1">
        <a href="mailto:dianaseverukhina@gmail.com" aria-label="Email" style="left:7.185%;top:13.806%;width:24.958%;height:2.405%"></a>
        <a href="https://t.me/strudeell" target="_blank" rel="noopener" aria-label="Telegram" style="left:33.025%;top:13.806%;width:18.277%;height:2.405%"></a>
        <a href="https://www.figma.com/design/fZY4lrumURiRJfzgltUljY" target="_blank" rel="noopener" aria-label="Портфолио в Figma" style="left:23.193%;top:17.369%;width:32.395%;height:1.425%"></a>
      </figure>
      <figure class="rs-page">
        <img src="assets/docs/resume-p2.webp" width="1488" height="2105" alt="Резюме Дианы Северюхиной, страница 2" loading="lazy">
      </figure>
    </div>
  </main>
  <script>
    (() => {
      const box = document.getElementById('rs-pages');
      const open = () => {
        if (box.requestFullscreen) box.requestFullscreen().catch(() => box.classList.add('rs-full'));
        else box.classList.add('rs-full');
      };
      const close = () => { if (document.fullscreenElement) document.exitFullscreen(); box.classList.remove('rs-full'); };
      document.getElementById('rs-full').addEventListener('click', open);
      document.getElementById('rs-close').addEventListener('click', close);
      box.querySelectorAll('.rs-page img').forEach(img => img.addEventListener('click', () => { if (!document.fullscreenElement && !box.classList.contains('rs-full')) open(); }));
      addEventListener('keydown', e => { if (e.key === 'Escape') box.classList.remove('rs-full'); });
    })();
  </script>
</body>
</html>
